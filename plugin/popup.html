<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 350px; padding: 15px; font-family: system-ui; }
    .section { margin-bottom: 20px; }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { background: #4285f4; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; }
    button.secondary { background: #34a853; }
    .status { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #e7f3ff; color: #004085; }
    small { color: #666; display: block; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>📄 Webpage Indexer</h2>
  
  <div class="section">
    <label><strong>Backend API URL</strong></label>
    <input type="url" id="apiUrl" placeholder="https://your-server.com:8000" />
    <button id="saveApiBtn">💾 Save</button>
    <div id="apiStatus"></div>
    <small>After saving, visit your backend site once – the session token will be auto‑captured.</small>
  </div>

  <div class="section">
    <button id="indexBtn" class="secondary">📸 Index This Page</button>
    <div id="indexStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
