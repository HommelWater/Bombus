<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/themes.css">
  <style>
    :root {
      --color-background: #CADCAE;
      --color-card: #E1E9C9;
      --color-button: #EDA35A;
      --color-button-h: #FEE8D9;
      --color-text:black;
      --color-items: var(--color-background);
      --color-text-alt: var(--color-text);
      --color-border: #2222;
      --color-checkbox: var(--color-button-h);
      --color-checkbox-c: var(--color-button);
      --color-table-header: var(--color-checkbox-c);
      --color-table-row: var(--color-items);
      --color-subtable-header: var(--color-checkbox);
      --color-subtable-row: var(--color-card);
      --color-row-hover: var(--color-checkbox);
      --color-row-expanded: var(--color-row-hover);
    }
    /* ----- RESET & GLOBAL ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;               /* slightly narrower for compactness */
      padding: 12px;
      font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--color-background);
      color: var(--color-text);
      font-size: 13px;
      line-height: 1.4;
    }

    /* ----- SQUARE CORNERS (no radius) ----- */
    input, button, .status {
      border-radius: 0;
    }

    /* ----- TYPOGRAPHY ----- */
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.2px;
      color: var(--color-text);
      border-left: 3px solid var(--color-button);
      padding-left: 8px;
    }

    .section {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #4b5563;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      margin: 6px 0 8px 0;
      border: 1px solid var(--color-border);
      background: var(--color-card);
      font-size: 0.85rem;
      transition: 0.1s linear;
    }

    input:focus {
      outline: none;
      border-color: var(--color-border);
      box-shadow: 0 0 0 1px var(--color-button);
    }

    button {
      background: var(--color-button);
      color: var(--color-text);
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      width: 100%;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.1s ease;
      margin-top: 4px;
    }

    button:hover {
      background: var(--color-button-h);
    }

    button.secondary {
      background: var(--color-button);
    }

    button.secondary:hover {
      background: var(--color-button-h);
    }

    /* status messages – square & compact */
    .status {
      margin-top: 10px;
      padding: 6px 10px;
      font-size: 0.7rem;
      font-weight: 500;
      border-left: 3px solid transparent;
    }

    .success {
      background: var(--color-success-bg);
      color: var(--color-text);
      border-left-color: var(--color-button);
    }

    .error {
      background: var(--color-error-bg);
      color: var(--color-error-text);
      border-left-color: #dc2626;
    }

    .info {
      background: var(--color-info-bg);
      color: var(--color-text);
      border-left-color: var(--color-button);
    }

    small {
      color: #6b7280;
      display: block;
      margin-top: 6px;
      font-size: 0.65rem;
      line-height: 1.3;
    }

    hr {
      margin: 12px 0;
      border: none;
      border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <h2>📄 Webpage Indexer</h2>
  
  <div class="section">
    <label>🔗 BACKEND API URL</label>
    <input type="url" id="apiUrl" placeholder="https://your-server.com:8000" />
    <button id="saveApiBtn">💾 SAVE</button>
    <div id="apiStatus" class="status"></div>
    <small>After saving, visit your backend site once – the session token will be auto‑captured.</small>
  </div>

  <div class="section">
    <button id="indexBtn" class="secondary">📸 INDEX THIS PAGE</button>
    <div id="indexStatus" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
