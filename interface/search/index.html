<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widgets=resizes-content">
    <link rel="icon" href="./images/main.png" type="image/png">
    <title>Search</title>
    <link rel="stylesheet" href="/shared/webkit.css">
    <link rel="stylesheet" href="/search/styles.css">
    <link rel="stylesheet" href="/shared/themes.css">
    
    <script src="/search/scripts.js"></script>
    <script src="/shared/themes.js"></script>
</head>
<body>
    <div id="container" class="container">
        <div id="header"><h3>Search</h3></div>
        
        <div id="search">
            <form id="search-form" action="/search" method="GET">
                <input 
                    type="text" 
                    id="search-input" 
                    name="q" 
                    placeholder="Enter your search query..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="search-button">Search</button>
            </form>
            <div id="search-results"></div>
        </div>
        <div id="sidebar-r" class="sidebar">
            <div class="sidebar-items">
                <div id="settings-header" class="sidebar-item-header">
                    <h2>History</h2>
                </div>
                <div id="settings-content">
                    <p>No search history yet.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
