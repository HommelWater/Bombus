<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./images/main.png" type="image/png">
    <title>Chat</title>
    <link rel="stylesheet" href="/shared/webkit.css">
    <link rel="stylesheet" href="/app/styles.css">
    <link rel="stylesheet" href="/shared/themes.css">
    
    <script src="/app/scripts.js"></script>
    <script src="/shared/themes.js"></script>
    </head>
    <body>
    <div id="container" class="container">
        <div id ="sidebar-l" class="sidebar">
            <img id="main-image" src="/images/main.png">
            <div class="sidebar-items">
                <div id="settings-header" class="sidebar-item-header"><h2>Settings</h2><h2>☰</h2></div>
                    <div id="settings-content">
                        <div id="profile-picture-item" class="sidebar-item">
                        <label id="profile-picture-input-label" class="btn left" for="profile-picture-input">Change Profile Picture</label>
                        <input id="profile-picture-input" type="file" style="display:none">
                    </div>
                    <div id="invite-code-item" class="sidebar-item">
                        <button id="new-invite-button" style="width:100%" class="btn left">New Invite</button>
                        <div id="invite-code-subitem" style="display:none">
                            <input id="invite-code" placeholder="Loading..."></input>
                            <button id="invite-code-close-button" class="btn left">Close</button>
                        </div>
                    </div>
                    <div id="add-channel-item" class="sidebar-item">
                        <button id="add-channel-button" class="btn left">Add Channel</button>
                        <div id="add-channel-subitem" style="display:none">
                            <input id="channel-name" placeholder="New channel name"></input>
                            <button id="add-channel-add-button" class="btn left">Add</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sidebar-items">
                <div id="channels-header" class="sidebar-item-header"><h2>Channels</h2><h2>☰</h2></div>
                <div id="channels">
                    <div class="channel">
                        <div class="channel-main" style="display: flex;">
                            <div class="channel-name">
                                channel_name
                            </div>
                            <div class="btn left channel-join-button">
                                🎤
                            </div>
                        </div>
                        <div class="channel-users">
                            <div class="vc-user" style="display:flex;">
                                <img src="./images/users/1.webp" class="vc-user-icon">
                                <div class="vc-user-info">
                                    <div>username</div>
                                    <input type="range" min="1" max="100" value="100" class="volume-slider">
                                </div>
                            </div>
                            <div class="vc-user" style="display:flex;">
                                <img src="./images/users/2.webp" class="vc-user-icon">
                                <div class="vc-user-info">
                                    <div>username</div>
                                    <input type="range" min="1" max="100" value="100" class="volume-slider">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="chat" class="card">
            <div id="chat-header">
                <div id="sidebar-button"><h3>☰</h3></div>
                <h3 id="chat-header-text"></h3>
                <div id="chat-header-search">
                    <input id="search-bar" type="text" placeholder="Search...">
                    <button id="search-button">🔍</button>
                </div>
            </div>
            <div id="chat-window">

                <div class="chat-post">
                    <div class="post-username">
                        username
                        <div class="post-date">
                            01-01-2000
                        </div>
                    </div>
                    <div class="post-content-group">
                        <div class="post-content" id="post-${id}">
                            text content of post
                        </div>
                    </div>
                </div>
                <div class="chat-post">
                    <div class="post-username">
                        username
                        <div class="post-date">
                            01-01-2000
                        </div>
                    </div>
                    <div class="post-content-group">
                        <div class="post-content" id="post-${id}">
                            text content of post
                        </div>
                    </div>
                </div>

            </div>
            <div class="file-input">
                <label for="files-input">📁 Add files...</label>
                <input type="file" id="files-input" multiple style="display:none">
                <div id="upload-progress"></div>
            </div>
            <div id="message-box">
                <textarea id="user-input" placeholder="Type your message here..."></textarea>
                <button id="send-button" class="btn up">Send</button>
            </div>
        </div>
        <div id ="sidebar-r" class="sidebar">
            <div class="sidebar-items">
                <div id="users-header" class="sidebar-item-header"><h2>Users</h2><h2>☰</h2></div>
                <div id="user-list">
                    <div class="sidebar-item user">
                        <div style="display: flex;">
                            <img class="user-icon" src="/images/users/1.webp">
                            <div style="margin-top: auto; margin-bottom: auto;">
                                username
                            </div>
                            <div class="user-activity" style="margin-left: auto; padding: 8px;">
                                🟢
                            </div>
                        </div>
                        <div class="user-settings">
                            <div class="user-setting btn right ban-user">Ban</div>
                            <div class="user-setting btn right restrict-user">Restrict</div>
                            <div class="user-setting btn right admin-user">Make Admin</div>
                            <div class="user-setting btn right rename-user">Rename</div>
                            <div class="user-setting btn right change-pfp-user">Change pfp</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
