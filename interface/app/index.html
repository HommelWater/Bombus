<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="./images/main.png" type="image/png">
    <title>Chat</title>
    <link rel="stylesheet" href="/shared/webkit.css">
    <link rel="stylesheet" href="/app/styles.css">
    <link rel="stylesheet" href="/shared/themes.css">
    
    <script src="/app/scripts.js"></script>
    <script src="/shared/themes.js"></script>
    <link rel="manifest" href="/app/manifest.json">
    <meta name="theme-color" content="#181818">
    </head>
    <body>
    <div id="container" class="container">
        <div id ="sidebar-l" class="sidebar">
            <img id="main-image" src="/images/main.png">
            <div class="sidebar-items">
                <div id="channels-header" class="sidebar-item-header"><h2>Channels</h2><h2>☰</h2></div>
                <div id="channels"></div>
            </div>
        </div>
        <div id="chat" class="card">
            <div id="chat-header">
                <div id="sidebar-button"><h3>☰</h3></div>
                <h3 id="chat-header-text"></h3>
                <div id="chat-header-search">
                    <input id="search-bar" type="text" placeholder="Search...">
                    <button id="search-button">🔍</button>
                </div>
            </div>
            <div id="chat-window"></div>
            
            <div id="message-box">
                <div class="file-input">
                    <label id="files-input-label" for="files-input">📁</label>
                    <input type="file" id="files-input" multiple style="display:none">
                    <div id="upload-progress"></div>
                </div>
                <textarea id="user-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"></textarea>
                <button id="send-button" class="btn up">Send</button>
            </div>
        </div>
        <div id ="sidebar-r" class="sidebar">
            <div class="sidebar-items">
                <div id="settings-header" class="sidebar-item-header"><h2>Settings</h2><h2>☰</h2></div>
                <div id="settings-content">
                    <div id="theme-toggle-item" class="sidebar-item">
                        <button id="theme-toggle-button" class="btn left">Toggle Theme</button>
                    </div>
                    <div id="profile-picture-item" class="sidebar-item">
                        <label id="profile-picture-input-label" class="btn left" for="profile-picture-input">Change Profile Picture</label>
                        <input id="profile-picture-input" type="file" style="display:none">
                    </div>
                    <div id="invite-code-item" class="sidebar-item">
                        <button id="new-invite-button" class="btn left">New Invite</button>
                        <div id="invite-code-subitem" class="subitem" style="display:none">
                            <input id="invite-code" placeholder="Loading..."></input>
                            <button id="invite-code-close-button" class="btn right">Close</button>
                        </div>
                    </div>
                    <div id="add-channel-item" class="sidebar-item">
                        <button id="add-channel-button" class="btn left">Add Channel</button>
                        <div id="add-channel-subitem" class="subitem" style="display:none">
                            <input id="channel-name" placeholder="New channel name"></input>
                            <button id="add-channel-add-button" class="btn right">Add</button>
                        </div>
                    </div>
                    <div id="delete-channel-item" class="sidebar-item">
                        <button id="delete-channel-button" class="btn left">Delete Channel</button>
                        <div id="delete-channel-subitem" class="subitem" style="display:none">
                            <select id="delete-channel-name" class="dropdown"></select>
                            <button id="delete-channel-delete-button" class="btn right">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sidebar-items">
                <div id="users-header" class="sidebar-item-header"><h2>Users</h2><h2>☰</h2></div>
                <div id="user-list"></div>
            </div>
        </div>
    </div>
    </body>
</html>
