<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./images/cato.png" type="image/png">
    <title>Chat</title>
    <link rel="stylesheet" href="/shared/webkit.css">
    <link rel="stylesheet" href="/main/styles.css">
    <link rel="stylesheet" href="/shared/themes.css">
    
    <script src="/main/scripts.js" type="module"></script>
    <script src="/main/voice.js" type="module"></script>
    <script src="/main/persistent.js" type="module"></script>
    <script src="/shared/themes.js"></script>
    </head>
    <body>
    <div id="container" class="container">
        <div id ="sidebar" class="sidebar">
            <img src="./images/cato.png" style="width: 100%; height:auto;cursor: pointer;" id="main-image">
            <h2>Settings</h2>
            <div class="sidebar-item">
                <div id="profile-picture-item" style="display:flex;margin:2px">
                    <label class="profile-picture-input-label btn left" for="profile-picture-input">Change Profile Picture</label>
                    <input type="file" id="profile-picture-input">
                </div>
                <div id="invite-code-item" style="display:flex;margin:2px">
                    <button id="new-invite-button" style="width:100%" class="btn left">New Invite</button>
                </div>
                <div id="add-channel-item" style="display:flex;margin:2px">
                    <button id="add-channel-button" style="width:100%" class="btn left">Add Channel</button>
                </div>
            </div>          
            <h2>Channels</h2>
            <div id="channels"></div>
        </div>
        <div class="card" id="chat-card">
            <div id="chat-header" style="text-align: left; display: flex;">
                <div id="sidebar-button" class="sidebar-button" style="text-align: left; width:30px;"><h3>☰</h3></div>
                <h3 id="chat-header-text"></h3>
                <div id="chat-header-search" style="margin-left:auto">
                    <input type="text" id="search-bar" placeholder="Search...">
                    <button id="search-button" style="background:none;border:none">🔍</button>
                </div>
            </div>
            <div id="chat-window" style="color: var(--color-text);"></div>
        <div class="form-group">
            <textarea id="user-input" placeholder="Type your message here..."></textarea>
            <button id="send-button" style="height:100%;" class="btn up">Send</button>
        </div>
        </div>
        <div id ="sidebar-r" class="sidebar">
            <h2>Users</h2>
        </div>
    </div>
    <div id="rclick-settings"></div>
    </body>
</html>
