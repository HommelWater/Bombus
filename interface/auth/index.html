<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./images/icon.jpg" type="image/png">
    <title>Login</title>
    <link rel="stylesheet" href="/shared/webkit.css">
    <link rel="stylesheet" href="/auth/styles.css">
    <link rel="stylesheet" href="/shared/themes.css">
    
    <script src="/auth/scripts.js" type="module"></script>
    <script src="/shared/themes.js"></script>
    <script src="/auth/qrcode.min.js"></script>

        <div id="login" class="login">
            <h2 style="padding:10px">Log in :D</h2>
            <div class="form-group" style="padding:20px;">

                <input id="login-code" placeholder="Login / Invite Code"></input>
                <button id="login-button" class="btn">Log in / Sign up</button>
            </div>
            <div id="qrcode-label"></div>
            <div id="qrcode"></div>
        </div>
    </body>
</html>
