<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./images/icon.jpg" type="image/png">
    <title>Buzz</title>
    <link rel="stylesheet" href="./webkit.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./themes.css">
    
    <script src="./scripts.js" type="module"></script>
    <script src="./voice.js" type="module"></script>
    <script src="./themes.js"></script>
    <script src="./qr/qrcode.min.js"></script>
    </head>
    <body>
    <div id="login" class="login">
        <h2 style="padding:10px">Log in to Buzz!</h2>
        <div class="form-group" style="padding:20px;">
            <input id="login-username" placeholder="Username"></input>
            <input id="login-code" placeholder="Login / Invite Code"></input>
            <button id="login-button" class="btn">Log in / Sign up</button>
        </div>
        <div id="qrcode"></div>
    </div>
    <div id="container" class="container" style="display:none;">
        <div id ="sidebar" class="sidebar">
            <img src="./images/icon.jpg" style="width: 100%; height:auto;">
            <h2>Settings</h2>
            <div id="profile-picture-item" class="sidebar-item" style="display:flex;">
                <label class="profile-picture-input-label" for="profile-picture-input">Change Profile Picture</label>
                <input type="file" id="profile-picture-input">
            </div>
            <div id="invite-code-item" class="sidebar-item" style="display:flex;">
                <button id="new-invite-button" style="width:100%" class="btn">New Invite</button>
            </div>
            <div id="add-channel-item" class="sidebar-item" style="display:flex;">
                <button id="add-channel-button" style="width:100%" class="btn">Add Channel</button>
            </div>
            <h2>Channels</h2>
            <div id="channels"></div>
        </div>
        <div class="card" id="chat-card">
            <div id="chat-header" style="text-align: left; display: flex;">
                <div id="sidebar-button" class="sidebar-button" style="text-align: left; width:30px;"><h3>☰</h3></div>
                <h3 id="chat-header-text"></h3>
            </div>
            <div id="chat-window" style="color: var(--color-text);"></div>
        <div class="form-group">
            <textarea id="user-input" placeholder="Typ hier jouw bericht..."></textarea>
            <button id="send-button" class="btn">Verstuur</button>
        </div>
        </div>
    </div>
    </body>
</html>
